<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Repülőjárat Nyilvántartó</title>
    <style>

        body {
            font-family: 'Times New Roman', Times, Georgia, serif;
            background-color: #f4f2ee;
            color: #1a1a1a;
            margin: 0;
            padding: 50px 20px;
        }

        .main-wrapper {
            max-width: 1050px;
            margin: 0 auto;
        }


        h1 {
            font-family: "Georgia", serif;
            color: #002855;
            font-size: 34px;
            font-weight: 300;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
            border-bottom: 1px solid #e5dfd9;
            padding-bottom: 15px;
        }

        h2 {
            font-family: "Georgia", serif;
            color: #002855;
            font-size: 19px;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }


        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 25px rgba(0, 40, 85, 0.02);
            margin-bottom: 35px;
            border-top: 4px solid #d71920;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -4px;
            left: 33.33%;
            width: 33.33%;
            height: 4px;
            background-color: #ffffff;
        }

        .container::after {
            content: "";
            position: absolute;
            top: -4px;
            right: 0;
            width: 33.33%;
            height: 4px;
            background-color: #008751;
        }


        .form-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            align-items: flex-end;
            width: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }

        .input-group label {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            font-style: italic;
            color: #555555;
            margin-bottom: 6px;
        }


        input {
            font-family: 'Times New Roman', Times, serif;
            padding: 11px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            font-size: 15px;
            color: #1a1a1a;
            background-color: #ffffff;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 0;
        }

        input:focus {
            outline: none;
            border-color: #002855;
            box-shadow: 0 0 0 3px rgba(0, 40, 85, 0.05);
        }


        button[onclick="addFlight()"] {
            font-family: 'Times New Roman', Times, serif;
            padding: 0 25px;
            background-color: #002855;
            color: #ffffff;
            border: none;
            cursor: pointer;
            border-radius: 3px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s;
            height: 41px;
            flex-shrink: 0;
        }

        button[onclick="addFlight()"]:hover {
            background-color: #001833;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            font-size: 15px;
        }


        th {
            background-color: #002855;
            color: #ffffff;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #eaedf1;
            background-color: #ffffff;
        }

        tbody tr:hover {
            background-color: #faf9f6;
        }


        .status-cell {
            font-weight: 600;
            color: #002855;
            font-style: italic;
        }


        button[onclick^="deleteFlight"] {
            font-family: 'Times New Roman', Times, serif;
            background: none;
            color: #888888;
            border: none;
            padding: 0;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
            transition: color 0.2s;
        }

        button[onclick^="deleteFlight"]:hover {
            color: #d71920;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Új repülőjárat hozzáadása</h2>

    <div class="form-row" autocomplete="off">
        <input type="text" id="name" placeholder="Légitársaság">
        <input type="text" id="type" placeholder="Típusa">
        <input type="text" id="number" placeholder="Járatszám">
        <input type="text" id="tocity" placeholder="Honnan">
        <input type="text" id="fromcity" placeholder="Hová">
        <input type="text" id="status" placeholder="Státusz">
        <input type="text" id="gate" placeholder="Kapu">

        <button onclick="addFlight()">Mentés</button>
    </div>
</div>

<div class="container">
    <h2>Aktuális járatok</h2>
    <table id="flightsTable">
        <thead>
        <tr>
            <th>Légitársaság</th>
            <th>Típus</th>
            <th>Járatszám</th>
            <th>Honnan</th>
            <th>Hová</th>
            <th>Státusz</th>
            <th>Kapu</th>
            <th>Művelet</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    function loadFlights() {
        fetch('/api/flights')
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#flightsTable tbody');
                tbody.innerHTML = '';
                data.forEach(item => {
                    /
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.airline ? item.airline.name : 'N/A'}</td>
                            <td>${item.type}</td>
                            <td>${item.number}</td>
                            <td>${item.tocity || ''}</td>
                            <td>${item.fromcity || ''}</td>
                            <td class="status-cell">${item.status}</td>
                            <td>${item.gate}</td>
                            <td>
                                <button onclick="deleteFlight(${item.id})" style="background:#ff4d4d; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Törlés</button>
                            </td>
                        </tr>`;
                });
            });
    }

    function addFlight() {
        const flightData = {
            airline: { name: document.getElementById('name').value },
            number: document.getElementById('number').value,
            type: document.getElementById('type').value,
            fromcity: document.getElementById('fromcity').value,
            tocity: document.getElementById('tocity').value,
        };

        fetch('/api/flights', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(flightData)
        })
        .then(res => {
            if (res.ok) {
                document.getElementById('name').value = '';
                document.getElementById('number').value = '';
                document.getElementById('type').value = '';
                document.getElementById('fromcity').value = '';
                document.getElementById('tocity').value = '';
                document.getElementById('status').value = '';
                document.getElementById('gate').value = '';

                loadFlights();
                alert("Sikeres mentés!");
            } else {
                alert("Hiba!");
            }
        });
    }

    function deleteFlight(id) {
        if(confirm("Biztosan törlöd?")) {
            fetch('/api/flights/' + id, { method: 'DELETE' })
                .then(res => {
                    if(res.ok) loadFlights();
                });
        }
    }

    loadFlights();
</script>
</body>
</html>
